name: integration

# ─────────────────────────────────────────────────────────────────────────────
# NUGET INTEGRATION SKIPPED — Total is Docker-first (nupkg ~393 MB, not on NuGet).
# The suite launches the server via `dnx GroupDocs.Total.Mcp@<version>` pulled from
# NuGet.org, which cannot resolve while the package is unpublished. So the dnx
# "Integration tests" step below is DISABLED; Restore + Build still validate that the
# test project compiles.
# REVERT when NuGet publishing is restored (see the main repo's publish_prod.yml
# "REVERT TO NUGET" note): un-skip the "Integration tests" step (original command is
# preserved in the comment above it).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly — catches regressions introduced by nuget.org / dnx / runtime changes.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      package_version:
        description: "GroupDocs.Total.Mcp version on nuget.org to test"
        required: false
        default: "26.7.3"
  # Triggered from the main repo's publish workflow right after a NuGet push.
  # Payload: { "package_version": "x.y.z" }
  repository_dispatch:
    types: [nuget-published]

jobs:
  test:
    name: ${{ matrix.os }} · dnx
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      MCP_PACKAGE_VERSION: >-
        ${{ github.event.inputs.package_version
            || github.event.client_payload.package_version
            || '26.7.3' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Multiple bundled GroupDocs.Total engines (Annotation, Watermark,
      # Signature, Viewer, Conversion, Comparison) rasterise document pages
      # via System.Drawing.Common — which P/Invokes libgdiplus on Linux and
      # uses libfontconfig1 for font discovery. The engines RENDER text glyphs
      # (annotation messages, signed-text overlays, watermark text, comment
      # threads, etc.) so Microsoft core fonts must also be present
      # (ttf-mscorefonts-installer + debconf EULA accept + fc-cache so
      # freshly-installed faces are discoverable). Mirrors the apt-get block
      # in the main repo's docker/Dockerfile so rendered-output assertions
      # don't fail on missing font / glyph rendering on Linux runners.
      - name: Install Linux native deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends \
            libgdiplus libfontconfig1 ttf-mscorefonts-installer
          sudo fc-cache -f -v > /dev/null

      # macOS runners ship neither GDI+ nor libgdiplus. GroupDocs engines that
      # touch image / spreadsheet content P/Invoke System.Drawing, which loads
      # libgdiplus. The dnx-spawned server's dyld does NOT search the Homebrew
      # prefix or /usr/local/lib (a failing run showed its dlopen only probes the
      # package dir, the .NET shared-framework dir, and /usr/lib). So install via
      # Homebrew and copy the dylib into the .NET runtime's shared-framework dir,
      # a path .NET's System.Drawing explicitly probes; libgdiplus's own deps
      # (cairo, glib, …) stay resolvable via the absolute Homebrew paths baked
      # into its load commands. (Windows has GDI+ built in; Linux: apt above.)
      - name: Install macOS native deps
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew install mono-libgdiplus
          GDIP="$(brew --prefix mono-libgdiplus)/lib/libgdiplus.dylib"
          otool -L "$GDIP" || true
          for d in "$HOME/.dotnet/shared/Microsoft.NETCore.App/"*/ ; do
            cp -f "$GDIP" "$d"
            echo "installed libgdiplus -> $d"
          done

      - name: Show environment
        shell: bash
        run: |
          dotnet --info
          echo "Testing GroupDocs.Total.Mcp@${MCP_PACKAGE_VERSION}"
          dnx --help || true

      - name: Write GroupDocs license (optional)
        # If the repo defines a GROUPDOCS_LICENSE secret (base64 of a .lic file),
        # write it to disk and point GROUPDOCS_LICENSE_PATH at it. Unlocks the
        # licensed-mode Verify tests; evaluation-mode tests still run.
        env:
          GROUPDOCS_LICENSE: ${{ secrets.GROUPDOCS_LICENSE }}
        if: env.GROUPDOCS_LICENSE != ''
        shell: bash
        run: |
          echo "$GROUPDOCS_LICENSE" | base64 -d > "$RUNNER_TEMP/GroupDocs.lic"
          echo "GROUPDOCS_LICENSE_PATH=$RUNNER_TEMP/GroupDocs.lic" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # SKIPPED — Docker-first, not on NuGet (see the file-header note). REVERT: replace
      # this notice step with the original dnx test run:
      #   - name: Integration tests
      #     run: >-
      #       dotnet test --configuration Release --no-build
      #       --logger "trx;LogFileName=integration.trx"
      #       --logger "console;verbosity=detailed"
      - name: Integration tests (SKIPPED — Total is Docker-first, not on NuGet)
        run: |
          echo "::notice::Integration tests skipped — GroupDocs.Total.Mcp is not published to NuGet (~393 MB, Docker-first). The test project compiled (Restore + Build). Re-enable the dnx run when NuGet publishing is restored."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
